<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you | Ksenija Iakimova</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f4f2ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Cormorant:ital,wght@0,500;1,300&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --black: #0a0a0a; --sand: #f4f2ee; --gold: #806b47; --line: rgba(10,10,10,0.12); }
html, body { height: 100%; }
body {
    font-family: 'Cormorant', Georgia, 'Times New Roman', serif; font-weight: 300;
    background: var(--sand); color: var(--black);
    display: flex; flex-direction: column; justify-content: center;
    padding: 2rem clamp(1.4rem, 5vw, 4rem);
    -webkit-font-smoothing: antialiased;
}
main { max-width: 1240px; width: 100%; margin: 0 auto; }
h1 { font-weight: 500; text-transform: uppercase; line-height: 0.98; letter-spacing: 0.015em; font-size: clamp(2.8rem, 10vw, 8rem); }
p { margin-top: 1.2rem; font-style: italic; font-size: clamp(1.2rem, 2.1vw, 1.45rem); color: rgba(10,10,10,0.74); }
a {
    display: inline-block; margin-top: clamp(2.6rem, 7vh, 4.5rem);
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 0.62rem;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--black); text-decoration: none;
    padding-bottom: 0.45rem; border-bottom: 1px solid var(--line); transition: color 0.35s ease, border-color 0.35s ease;
}
a:hover { color: var(--gold); border-color: var(--gold); }
a:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }
</style>
</head>
<body>
<main>
    <h1>Thank you.</h1>
    <p>I'll be in touch.</p>
    <a href="/">← Back</a>
</main>
</body>
</html>
